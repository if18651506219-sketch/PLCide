<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLC-AI IDE Demo</title>
    <link rel="stylesheet" href="styles.css?v=node-logic-logo-1" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7-11-7Z"></path></symbol>
      <symbol id="i-layout" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></symbol>
      <symbol id="i-table" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M9 5v14M15 5v14"></path></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"></path></symbol>
      <symbol id="i-flow" viewBox="0 0 24 24"><path d="M6 7h6a4 4 0 0 1 0 8H8M8 15l-3-3 3-3"></path></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"></path></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M4 19V7h6l2 2h8v10H4zM4 11h16"></path></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 5h12l2 2v12H5zM8 5v6h8M8 19v-5h8v5"></path></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"></path></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 20h14"></path></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12"></path></symbol>
      <symbol id="i-condition" viewBox="0 0 24 24"><path d="M4 12h4M16 12h4M8 7v10M16 7v10M10 7h4M10 17h4"></path></symbol>
      <symbol id="i-action" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 9-12h-6l1-6Z"></path></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><path d="M8 8h11v11H8zM5 16V5h11"></path></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 5h6l1 3H8l1-3ZM6 8h12v11H6z"></path></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"></path></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></symbol>
    </svg>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-label="PLC-AI 快速搭建工具">
            <svg class="brand-mark-svg" viewBox="0 0 240 96" role="img" aria-hidden="true">
              <path class="mark-glyph mark-stem" d="M33 75 C31 57 30 31 30 10" />
              <path class="mark-glyph mark-loop" d="M31 15 C58 1 80 15 66 33 C56 45 44 52 30 58" />
              <path class="mark-glyph mark-foot" d="M31 62 C48 62 53 68 39 74 C27 80 17 87 10 94" />
              <path class="mark-glyph mark-swoosh" d="M54 84 C102 64 151 55 214 54" />
              <path class="mark-glyph mark-arrow" d="M195 38 C211 42 227 48 236 56 C223 66 206 72 191 75" />
            </svg>
          </div>
          <div class="brand-copy">
            <h1><span class="brand-cn">热套压机</span><span class="brand-product">PLC-AI IDE</span></h1>
            <p><span>器件库</span><span class="brand-dot"></span><span>程序流</span><span class="brand-dot"></span><span>工站</span></p>
          </div>
        </div>
        <div class="toolbar" aria-label="主工具栏">
          <div class="toolbar-group" aria-label="建模与编译">
            <button id="compileBtn" class="secondary tool-button command-tool" title="编译" aria-label="编译"><svg class="tool-svg"><use href="#i-play"></use></svg><span>编译</span></button>
            <button id="tidyBtn" class="secondary tool-button" title="整理画布" aria-label="整理画布"><svg class="tool-svg"><use href="#i-layout"></use></svg><span>整理</span></button>
            <button id="modelerBtn" class="secondary tool-button wide" title="参数建模" aria-label="参数建模"><svg class="tool-svg"><use href="#i-table"></use></svg><span>参数</span></button>
          </div>
          <div class="toolbar-group view-toolbar-group" aria-label="视图">
            <button id="toggleVariableBtn" class="secondary tool-button view-tool" title="显示或隐藏变量区" aria-label="显示或隐藏变量区" aria-pressed="true"><svg class="tool-svg"><use href="#i-sidebar"></use></svg><span>变量</span></button>
            <button id="toggleProgramBtn" class="secondary tool-button view-tool" title="显示或隐藏程序流" aria-label="显示或隐藏程序流" aria-pressed="true"><svg class="tool-svg"><use href="#i-flow"></use></svg><span>程序</span></button>
            <button id="toggleCodeBtn" class="secondary tool-button view-tool" title="显示或隐藏代码预览" aria-label="显示或隐藏代码预览" aria-pressed="true"><svg class="tool-svg"><use href="#i-code"></use></svg><span>代码</span></button>
          </div>
          <details class="toolbar-menu" id="toolbarMenu">
            <summary title="更多操作" aria-label="更多操作" aria-expanded="false"><svg class="tool-svg"><use href="#i-more"></use></svg><span>更多</span></summary>
            <div class="toolbar-menu-panel">
              <div class="menu-section-title">项目</div>
              <button id="newProjectBtn" class="menu-item" title="新建项目"><svg class="tool-svg"><use href="#i-plus"></use></svg><span>新建项目</span></button>
              <button id="openProjectBtn" class="menu-item" title="打开项目"><svg class="tool-svg"><use href="#i-open"></use></svg><span>打开项目</span></button>
              <button id="saveProjectBtn" class="menu-item" title="保存项目"><svg class="tool-svg"><use href="#i-save"></use></svg><span>保存项目</span></button>
              <div class="menu-section-title">变量文件</div>
              <button id="importVariablesBtn" class="menu-item" title="导入变量"><svg class="tool-svg"><use href="#i-download"></use></svg><span>导入变量</span></button>
              <button id="exportVariablesBtn" class="menu-item" title="导出变量"><svg class="tool-svg"><use href="#i-upload"></use></svg><span>导出变量</span></button>
              <div class="menu-section-title">危险操作</div>
              <button id="clearBtn" class="menu-item danger-menu-item" title="清空画布"><svg class="tool-svg"><use href="#i-trash"></use></svg><span>清空画布</span></button>
            </div>
          </details>
        </div>
      </header>

      <main class="workspace">
        <div id="stationScroller" class="station-scroller"></div>
        <div class="pane-resizer workspace-resizer" data-resizer="workspace" title="调整代码宽度"></div>

        <aside class="code-panel">
          <div class="panel-head code-head">
            <div class="code-titlebar">
              <h2>代码预览</h2>
              <select id="codeStationSelect" class="station-inline-select code-station-select" aria-label="选择代码工站"></select>
              <span id="codeHint" class="code-status">未编辑</span>
            </div>
            <div class="code-tools">
              <input id="codeFindInput" class="code-find-input" placeholder="查找变量或文本" />
              <button id="codeFindPrev" class="secondary small text-icon-button compact" type="button" title="上一个" aria-label="上一个"><svg class="tool-svg"><use href="#i-chevron-up"></use></svg><span>上一个</span></button>
              <button id="codeFindNext" class="secondary small text-icon-button compact" type="button" title="下一个" aria-label="下一个"><svg class="tool-svg"><use href="#i-chevron-down"></use></svg><span>下一个</span></button>
              <span id="codeCursorInfo" class="code-cursor-info">Ln 1, Col 1</span>
            </div>
            <div class="ai-summary" id="aiSummary">尚未编译。点击“编译”后生成梯形图逻辑与代码。</div>
          </div>
          <div class="code-editor">
            <div id="codeActiveLine" class="code-active-line" aria-hidden="true"></div>
            <pre id="codeLineNumbers" class="code-line-numbers" aria-hidden="true"></pre>
            <pre id="codeHighlight" class="code-highlight" aria-hidden="true"></pre>
            <textarea id="codePreview" class="code-preview" spellcheck="false"></textarea>
            <div id="codeSuggest" class="code-suggest" hidden></div>
          </div>
        </aside>
      </main>
    </div>
    <div id="targetModal" class="modal-backdrop" hidden>
      <section class="target-modal" role="dialog" aria-modal="true" aria-labelledby="targetModalTitle">
        <header class="target-modal-head">
          <div>
            <h2 id="targetModalTitle">编辑执行器目标</h2>
            <p id="targetModalMeta">目标保存后会更新器件库和后续动作。</p>
          </div>
          <button id="targetModalClose" class="secondary small" type="button">关闭</button>
        </header>
        <div id="targetRows" class="target-rows"></div>
        <footer class="target-modal-actions">
          <button id="targetAddRow" class="secondary" type="button">添加目标</button>
          <span></span>
          <button id="targetSaveFile" class="secondary" type="button">保存到文件</button>
          <button id="targetSave" class="secondary primary-action" type="button">保存</button>
        </footer>
      </section>
    </div>
    <textarea id="clipboardFallback" class="clipboard-fallback" aria-hidden="true"></textarea>
    <input id="projectFileInput" class="file-input-hidden" type="file" accept=".json,.plcide,application/json" />
    <input id="variableExcelInput" class="file-input-hidden" type="file" accept=".xls,.html,.htm,.csv,text/html,text/csv,application/vnd.ms-excel" />
    <div id="modelerModal" class="modal-backdrop" hidden></div>
    <script src="data.js?v=split-1"></script>
    <script src="utils.js?v=split-1"></script>
    <script src="app.js?v=node-logic-1"></script>
    <script src="codegen.js?v=split-1"></script>
    <script src="project-io.js?v=split-1"></script>
    <script src="modeler.js?v=modeler-1"></script>
  </body>
</html>
